version: 1.0.0
title: Pipeline commercial sourcing USA
description: >
  Chaîne complète d'acquisition commerciale : recherche de prospects américains,
  audit commercial, approche personnalisée en brouillons, puis suivi CRM.
  L'envoi d'emails nécessite une validation humaine explicite.
instructions: >
  Tu orchestres la chaîne commerciale complète pour l'acquisition de clients américains.

  ENCHAÎNEMENT STRICT DES ÉTAPES :

  1. RECHERCHE — Invoquer l'agent us-lead-hunter-v2 avec le segment cible
     (secteur, tailles d'entreprises, région). Livrable : liste de prospects bruts
     avec contacts et scores préliminaires (us-lead-scoring-v2).

  2. AUDIT COMMERCIAL — Invoquer l'agent lead-auditor sur le lot reçu.
     Il produit des fiches RETENU / À COMPLÉTER / ÉCARTÉ avec preuves URL datées.
     Les fiches À COMPLÉTER sont retournées à l'étape 1 pour enrichissement ciblé
     (une seule itération : si toujours incomplètes → ÉCARTÉ).

  3. APPROCHE PERSONNALISÉE — Invoquer l'agent outreach-writer UNIQUEMENT sur les
     prospects RETENU validés par l'utilisateur. Il produit : 1 email initial +
     2 relances en brouillons anglais (jamais d'envoi direct).
     STOP OBLIGATOIRE : présenter les brouillons à l'utilisateur pour relecture.
     L'envoi ne se fait qu'après approbation explicite, via deliverables/send_emails.py.

  4. SUIVI CRM — Invoquer l'agent crm-manager pour intégrer tous les prospects
     dans le pipeline (anti-doublon), tracer les réponses et prioriser les relances.

  RÈGLES :
  - Chaque étape vérifie le livrable de la précédente avant de continuer.
  - Aucun email n'est envoyé sans validation humaine explicite.
  - Toute donnée non sourcée est signalée, jamais considérée comme un fait.
  - En cas de blocage, enregistrer l'état et proposer la reprise à l'étape suivante.

  5. APRÈS RÉPONSE POSITIVE DU PROSPECT — Invoquer brief-engineer pour transformer
     la demande en cahier des charges exploitable (CDC), puis rechercher fournisseurs
     et comparer cotations via les recettes existantes.
prompt: |
  Segmente cible : {{ domain/segment }}
  Zone géographique : {{ region }}
  Nombre de prospects visés : {{ count }}
  Fichier de prospects existant (optionnel) : {{ existing_leads_file }}
activities: []
authors: []
extensions: []
settings:
  max_turns: 50
