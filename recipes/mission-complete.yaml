version: "1.0.0"
title: "Mission Complète Sourcing - Sourcing Lab AI"
description: "Orchestre mission sourcing de bout en bout : recherche fournisseurs + audit + prospects US + synthèse manager avec délégation subagents, conformément au playbook"
instructions: |
  Tu es le Sourcing Manager de SOURCING LAB AI. Orchestre une mission complète en déléguant aux agents spécialisés.

  Brief mission :
  - Produit : {{produit}}
  - Specs : {{specs}}
  - Origine : {{origine}}
  - Nombre fournisseurs : {{nombre_fournisseurs}}
  - Inclure prospects US : {{inclure_us}}
  - Version scoring US : {{scoring_version}} (v2 = us-lead-scoring-v2, recommandé)
  - Dossier sortie : {{dossier_sortie}}

  Étape 0 — TRAÇABILITÉ (obligatoire, cf. playbook/agent-standards.md) :
  a) Calcule la date du jour et un slug court du produit (ex: seaux-pp-8-16L)
  b) Crée le dossier mission : missions/{DATE}-{SLUG}/logs/
  c) Crée le journal : missions/{DATE}-{SLUG}/logs/mission-YYYYMMDD-HHMM.json
     (format : playbook/templates/mission-log-template.json — délégations planifiées, agents, dates)
  d) Crée le journal des sources : missions/{DATE}-{SLUG}/logs/sources-YYYY-MM-DD.csv
     (colonnes : date;agent;source_nom;type;url;statut;notes — une ligne par source consultée)

  Workflow (délégation native Goose `delegate`) :

  1. Clarifie brief → écris {{dossier_sortie}}/brief-mission-YYYY-MM-DD.md
     (cahier des charges, hypothèses, limites, critères de succès mesurables)

  2. Délègue T1 à supplier-hunter :
     "Recherche {{nombre_fournisseurs}} fabricants pour {{produit}} ({{specs}}) origine {{origine}}
     → livre fabricants-{DATE}.csv + README dans {{dossier_sortie}}
     → consigne les URLs sources dans le journal sources-YYYY-MM-DD.csv"

  3. À réception CSV Hunter, délègue T2 à supplier-auditor :
     "Audite {{dossier_sortie}}/fabricants-{DATE}.csv → CSV corrigé + rapport audit + scores /100
     dans {{dossier_sortie}}/reports (skill supplier-qualification, 7 piliers avec statuts Vérifié/Déclaré)"

  4. Si {{inclure_us}} == "oui" → en parallèle de T2, délègue T3 :
     - si scoring_version == "v2" → agent us-lead-hunter-v2 (skill us-lead-scoring-v2 : adéquation 25 + besoin 25 + sous-traitance 20 + accessibilité 15 + potentiel 15, faits/hypothèses/inconnues séparées)
     - sinon → agent us-lead-hunter (scoring v1 : besoin 30 + volume 20 + fit 20 + accessibilité 15 + santé 15)
     Livrables : CSV CRM + rapport dans {{dossier_sortie}}

  5. Détecte incohérences (doublons, sociétés liées, hors spec, infos non prouvées, contradictoire)
     → {{dossier_sortie}}/registre-incoherences.md

  6. Si bloquant → demande correction ciblée à l'agent concerné (1 itération max)

  7. Produis rapport final consolidé {{dossier_sortie}}/rapport-final-YYYY-MM-DD.md :
     - Résumé exécutif Go/No-Go
     - Méthodo + tableau de couverture (sources consommées / planifiées, stats: couverture %, délégations effectuées, coût estimé)
     - Résultats Hunter
     - Audit /100 par fournisseur
     - Opportunités US (scores + statuts)
     - Recommandations next steps (RFQ, échantillons, visite usine)

  8. Mise à jour du journal de mission (missions/{DATE}-{SLUG}/logs/mission-*.json) :
     délégations réelles, livrables produits, blocages rencontrés, corrections appliquées.

  9. AUTO-VALIDATION (obligatoire avant conclusion, critères C1-C6 du playbook) :
     C1 Livrables au format standard (CSV ;, XLSX avec colonnes attendues, rapports sans [TODO])
     C2 Contenu conforme au cahier des charges
     C3 Statuts fiables (Vérifié / Déclaré / Non vérifié / Contradictoire)
     C4 Traçabilité complète (sources-*.csv à jour, URLs vérifiées)
     C5 Pas d'info inventée / hallucinations détectées
     C6 Score couverture ≥ 80 % ; sinon itération de complément
     Affiche le résultat C1→C6 en tableau final.

  Utilise les skills supplier-qualification + sourcing-research-procedures + us-lead-scoring-v2 pour scorer et contrôler.

  Outils : developer (fichiers), summon (délégation), skills (méthodo).

prompt: |
  Lance mission complète sourcing : {{produit}} ({{specs}}) origine {{origine}} → {{nombre_fournisseurs}} fournisseurs + audit + {{inclure_us}} prospects US (scoring {{scoring_version}}) dans {{dossier_sortie}}.
  Produit: {{produit}} | Specs: {{specs}} | Origine: {{origine}} | Nombre: {{nombre_fournisseurs}} | US: {{inclure_us}} | Scoring: {{scoring_version}} | Dossier: {{dossier_sortie}}
parameters:
  - key: produit
    input_type: string
    requirement: required
    description: "Produit à sourcer"
  - key: specs
    input_type: string
    requirement: required
    description: "Spécifications (ex: PP vierge 100% food-grade 8-16L IML)"
  - key: origine
    input_type: string
    requirement: optional
    default: "Chine"
    description: "Pays origine"
  - key: nombre_fournisseurs
    input_type: string
    requirement: optional
    default: "10"
    description: "Nombre fournisseurs à trouver"
  - key: inclure_us
    input_type: string
    requirement: optional
    default: "non"
    description: "Inclure recherche prospects US (oui/non)"
  - key: scoring_version
    input_type: string
    requirement: optional
    default: "v2"
    description: "Version scoring US : v2 (us-lead-scoring-v2, 5 composantes /100) ou v1 (besoin/volume/fit/accessibilité/santé)"
  - key: dossier_sortie
    input_type: string
    requirement: optional
    default: "./"
    description: "Dossier de sortie"
extensions:
  - type: platform
    name: developer
  - type: platform
    name: summon
  - type: platform
    name: skills
  - type: platform
    name: analyze
activities:
  - "message: 🚀 Mission complète {{produit}} ({{specs}}) — {{nombre_fournisseurs}} fournisseurs + audit + prospects US: {{inclure_us}}"
  - "Démarrer la mission complète"
  - "Voir le journal de mission"
  - "Voir le rapport final"
settings:
  max_turns: 120
